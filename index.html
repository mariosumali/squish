<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>squish</title>
<meta name="description" content="A soft-body toybox — poke, squish, dent, crack, and pop procedural gummies in the browser.">
<meta name="theme-color" content="#f7f3ec">

<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">

<meta property="og:type" content="website">
<meta property="og:site_name" content="squish">
<meta property="og:title" content="squish">
<meta property="og:description" content="A soft-body toybox — poke, squish, dent, crack, and pop procedural gummies in the browser.">
<meta property="og:url" content="https://squishy.vercel.app/">
<meta property="og:image" content="https://squishy.vercel.app/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="A pink gummy bear above the squish wordmark">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="squish">
<meta name="twitter:description" content="A soft-body toybox — poke, squish, dent, crack, and pop procedural gummies in the browser.">
<meta name="twitter:image" content="https://squishy.vercel.app/og.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Baloo+2:wght@600;700&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: #f7f3ec; overflow: hidden; }
  @keyframes sqBlink { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }

  .app { position: fixed; inset: 0; background: #f7f3ec; font-family: 'IBM Plex Mono', ui-monospace, monospace; color: #8a7f74; user-select: none; -webkit-user-select: none; }
  button { -webkit-tap-highlight-color: transparent; }
  button:focus { outline: none; }
  button:focus-visible { outline: 2px solid #ff9fb8; outline-offset: 2px; }
  #mount { position: absolute; inset: 0; cursor: crosshair; touch-action: none; }

  .overlay-boot { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; z-index: 5; }
  .overlay-boot span { font-size: 11px; letter-spacing: 0.28em; color: #c9b9a8; animation: sqBlink 1.2s infinite; text-transform: lowercase; }
  .overlay-error { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; z-index: 20; }
  .overlay-error div { border: 1px solid #f0dcc9; background: #fff8f0; border-radius: 16px; padding: 18px 24px; font-size: 10px; letter-spacing: 0.1em; color: #a08a72; max-width: 380px; text-align: center; }

  /* ---- ambient chrome ---- */
  .wordmark { position: absolute; top: 14px; left: 18px; font-family: 'Baloo 2', sans-serif; font-size: 17px; font-weight: 700; color: #ff6f9e; opacity: 0.38; z-index: 6; pointer-events: none; }

  .toast { position: absolute; bottom: 68px; left: 50%; transform: translateX(-50%); font-size: 11px; letter-spacing: 0.24em; color: #b09a86; opacity: 0; transition: opacity 0.35s ease; pointer-events: none; text-transform: lowercase; z-index: 6; white-space: nowrap; }
  .toast.show { opacity: 1; }

  .switcher { position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 6px; z-index: 6; }
  .chev { width: 40px; height: 40px; border: none; background: transparent; border-radius: 99px; color: #c9b9a8; font-size: 22px; line-height: 1; cursor: pointer; font-family: inherit; padding: 0 0 3px; }
  .chev:hover { color: #ff6f9e; background: rgba(255, 233, 241, 0.6); }
  .dots { display: flex; align-items: center; }
  .dotbtn { width: 18px; height: 40px; border: none; background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0; }
  .dotbtn .d { width: 5px; height: 5px; border-radius: 99px; background: #ddd0bf; transition: all 0.2s ease; }
  .dotbtn:hover .d { background: #ffb3c9; }
  .dotbtn.active .d { width: 14px; background: #ff6f9e; }

  .settings-pill { position: absolute; right: 16px; bottom: 16px; width: 46px; height: 46px; border-radius: 99px; border: 1px solid #efe6da; background: #fffdf9; color: #b09a86; font-family: inherit; font-size: 16px; letter-spacing: 0.06em; cursor: pointer; z-index: 8; box-shadow: 0 4px 16px rgba(160, 130, 100, 0.10); padding-bottom: 6px; }
  .settings-pill:hover { color: #d14a75; border-color: #ffd4e2; }
  .settings-pill.open { color: #d14a75; background: #ffe9f1; border-color: #ffd4e2; }

  /* ---- settings panel ---- */
  .scrim { position: absolute; inset: 0; z-index: 7; display: none; }
  .scrim.open { display: block; }
  .panel { position: absolute; right: 16px; bottom: 72px; width: 280px; max-width: calc(100vw - 32px); max-height: calc(100vh - 100px); max-height: calc(100dvh - 100px); overflow-y: auto; background: #fffdf9; border: 1px solid #efe6da; border-radius: 20px; box-shadow: 0 12px 40px rgba(160, 130, 100, 0.18); z-index: 8; display: none; box-sizing: border-box; padding: 14px 16px 16px; scrollbar-width: thin; scrollbar-color: #e8dccd transparent; }
  .panel.open { display: block; }

  .panel-head { display: flex; align-items: center; margin-bottom: 4px; }
  .panel-name { font-size: 9px; letter-spacing: 0.22em; color: #c2b4a4; text-transform: lowercase; flex: 1; }
  .panel-x { width: 30px; height: 30px; border: none; background: transparent; border-radius: 99px; color: #c2b4a4; font-size: 16px; cursor: pointer; font-family: inherit; margin-right: -8px; }
  .panel-x:hover { color: #d14a75; background: #fff0f5; }

  .sec-title { font-size: 8px; letter-spacing: 0.2em; color: #c9b9a8; text-transform: lowercase; padding: 10px 0 6px; }

  .obj-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
  .obj-chip { border: 1px solid #efe6da; background: transparent; border-radius: 10px; color: #8a7f74; font-family: inherit; font-size: 9px; letter-spacing: 0.04em; padding: 8px 6px; cursor: pointer; text-transform: lowercase; min-height: 32px; }
  .obj-chip:hover { background: #faf3ea; }
  .obj-chip.active { background: #ffe9f1; border-color: #ffd4e2; color: #d14a75; }

  .looks-row { display: flex; gap: 10px; padding: 2px 2px 4px; }
  .swatch { width: 30px; height: 30px; border-radius: 99px; border: 2px solid #efe6da; cursor: pointer; padding: 0; box-sizing: border-box; }
  .swatch.active { border-color: #ff6f9e; box-shadow: 0 0 0 2px #ffe9f1; }

  .panel-row { display: flex; align-items: center; gap: 8px; min-height: 36px; }
  .row-label { font-size: 10px; letter-spacing: 0.06em; color: #7a7069; text-transform: lowercase; flex: 1; }
  .badge { font-size: 8px; letter-spacing: 0.08em; color: #b8ab9d; background: #f5ede1; border-radius: 99px; padding: 3px 8px; text-transform: lowercase; }
  .badge.live { color: #3f9a6e; background: #e3f5ec; }
  .badge.denied { color: #c9563f; background: #ffe8e0; }
  .mini-btn { border: 1px solid #ecdfce; background: transparent; border-radius: 99px; color: #8a7f74; font-family: inherit; font-size: 8px; letter-spacing: 0.1em; padding: 5px 10px; cursor: pointer; text-transform: lowercase; }
  .mini-btn:hover { background: #fff0f5; color: #d14a75; border-color: #ffd4e2; }

  .toggle { width: 40px; height: 24px; border-radius: 99px; border: 1px solid #ecdfce; background: #f3ebdf; cursor: pointer; position: relative; padding: 0; transition: background 0.15s ease; }
  .toggle .knob { position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 99px; background: #fffdf9; box-shadow: 0 1px 3px rgba(160, 130, 100, 0.3); transition: left 0.15s ease; }
  .toggle.on { background: #ff9fb8; border-color: #ff9fb8; }
  .toggle.on .knob { left: 19px; }

  details.tuning { border-top: 1px solid #f5ede1; margin-top: 8px; }
  details.tuning summary { list-style: none; cursor: pointer; font-size: 8px; letter-spacing: 0.2em; color: #c9b9a8; text-transform: lowercase; padding: 10px 0 6px; display: flex; align-items: center; }
  details.tuning summary::-webkit-details-marker { display: none; }
  details.tuning summary::after { content: '▾'; margin-left: 6px; font-size: 8px; transition: transform 0.15s ease; }
  details.tuning[open] summary::after { transform: rotate(180deg); }
  .tune-row { padding: 2px 0 6px; }
  .tune-head { display: flex; align-items: baseline; }
  .tune-label { font-size: 9px; letter-spacing: 0.06em; color: #8a7f74; flex: 1; text-transform: lowercase; }
  .tune-val { font-size: 9px; color: #4a4239; }
  .tune-row input[type="range"] { -webkit-appearance: none; appearance: none; width: 100%; height: 22px; margin: 0; display: block; touch-action: none; background: transparent; cursor: ew-resize; }
  .tune-row input[type="range"]::-webkit-slider-runnable-track { height: 5px; border-radius: 99px; background: #f3ebdf; }
  .tune-row input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 15px; height: 15px; border-radius: 99px; background: #ff6f9e; margin-top: -5px; border: none; box-shadow: 0 1px 3px rgba(160, 130, 100, 0.3); }
  .tune-row input[type="range"]::-moz-range-track { height: 5px; border-radius: 99px; background: #f3ebdf; }
  .tune-row input[type="range"]::-moz-range-progress { height: 5px; border-radius: 99px; background: #ff9fb8; }
  .tune-row input[type="range"]::-moz-range-thumb { width: 15px; height: 15px; border-radius: 99px; background: #ff6f9e; border: none; box-shadow: 0 1px 3px rgba(160, 130, 100, 0.3); }

  .reset-btn { width: 100%; margin-top: 10px; border: 1px solid #ecdfce; background: transparent; border-radius: 12px; color: #8a7f74; font-family: inherit; font-size: 9px; letter-spacing: 0.14em; padding: 10px; cursor: pointer; text-transform: lowercase; }
  .reset-btn:hover { background: #fff0f5; color: #d14a75; border-color: #ffd4e2; }

  @media (max-width: 420px) {
    .panel { right: 12px; left: 12px; width: auto; bottom: 76px; }
    .settings-pill { right: 12px; bottom: 12px; }
    .dotbtn { width: 13px; }
    .chev { width: 34px; }
    .switcher { transform: translateX(calc(-50% - 14px)); }
  }
</style>
</head>
<body>
<div class="app">
  <div id="mount"></div>

  <div id="overlay-boot" class="overlay-boot"><span>booting renderer</span></div>
  <div id="overlay-error" class="overlay-error"><div id="error-msg"></div></div>

  <div class="wordmark">squish</div>
  <div id="toast" class="toast"></div>

  <div class="switcher">
    <button id="prev-btn" class="chev" aria-label="previous object">&#8249;</button>
    <div id="dots" class="dots"></div>
    <button id="next-btn" class="chev" aria-label="next object">&#8250;</button>
  </div>

  <button id="settings-btn" class="settings-pill" aria-label="settings">&#183;&#183;&#183;</button>
  <div id="scrim" class="scrim"></div>

  <div id="panel" class="panel" role="dialog" aria-label="settings">
    <div class="panel-head">
      <span class="panel-name">settings</span>
      <button id="panel-close" class="panel-x" aria-label="close settings">&#215;</button>
    </div>
    <div class="sec-title">object</div>
    <div id="obj-grid" class="obj-grid"></div>
    <div class="sec-title">look</div>
    <div id="looks-row" class="looks-row"></div>
    <div class="panel-row">
      <span class="row-label">sound</span>
      <button id="sound-toggle" class="toggle on" role="switch" aria-checked="true" aria-label="sound"><span class="knob"></span></button>
    </div>
    <div class="sec-title">input</div>
    <div class="panel-row">
      <span class="row-label">mouse / touch</span>
      <span class="badge">always on</span>
    </div>
    <div class="panel-row">
      <span class="row-label">hand</span>
      <span id="hand-status" class="badge">unavailable</span>
      <button id="hand-toggle" class="mini-btn" hidden>turn off</button>
    </div>
    <details class="tuning" id="tuning-details">
      <summary>tuning</summary>
      <div id="tuning-body"></div>
    </details>
    <button id="reset-btn" class="reset-btn">reset object</button>
  </div>
</div>
<script type="module" src="./app.js"></script>
</body>
</html>
